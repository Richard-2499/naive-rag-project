embedding:
  model: BAAI/bge-small-zh
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1


splitter:
  chunk_size: 512
  chunk_overlap: 128


retriever:
  similarity_top_k: 3


llm:
  model: deepseek-v4-flash
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  temperature: 0.1
  max_tokens: 512

paths:
  vector_store: "results/vector_store.json" # generate it by using `python src/vector_store.py` if not existed
  raw_data: "data/raw"
  validation_data: "data/validation"
  bm25_store: "results/bm25_store.json" 


retrieval:
  type: hybrid
  hybrid:
    alpha: 0.5
    candidate_k: 20
    top_k: 5