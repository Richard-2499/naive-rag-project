embedding:
  model: BAAI/bge-small-zh
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1


splitter:
  chunk_size: 512
  chunk_overlap: 128


llm:
  model: deepseek-v4-flash-0731
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  temperature: 0.1
  max_tokens: 512

paths:
  vector_store: "results/vector_store.json" # generate it by using `python src/vector_store.py` if not existed
  bm25_store: "results/bm25_store.json"
  raw_data: "data/raw"
  retriever_eval_dataset: "data/evaluation/retrieval_eval.json"
  preview_split: "results/preview_split"
  chunks_store: "results/chunks_store.json"
  evaluation_results: "results/evaluation"
  reranker_eval_dataset: "data/evaluation/reranker_eval.json"
  generator_eval_dataset: "data/evaluation/generation_eval_dataset10.json"


retrieval:
  type: hybrid
  hybrid:
    alpha: 0.5
    candidate_k: 30
    top_k: 5


reranker:
  enabled: true
  model: "D:/workspace/models/huggingface/bge-reranker-base"


logging:
  level: debug